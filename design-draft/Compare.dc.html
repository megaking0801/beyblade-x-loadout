<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif; }
    a { color: #ff6a4d; } a:hover { color: #ff8a72; }
    .code { font-stretch: 125%; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tag { font-size: 11px; border-radius: 5px; padding: 1px 6px; }
    .nav { flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600; }
    .axis { display: grid; grid-template-columns: 62px 1fr 1fr; align-items: center; gap: 8px; padding: 9px 13px; border-bottom: 1px solid #1d2635; }
    .axis-name { font-size: 12px; color: #9fb0c6; }
  </style>
</helmet>

<div style="width: 430px; min-height: 900px; background: #0b0f16; color: #e7ecf3; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 10px;">
    <div style="font-size: 26px; font-weight: 700; font-stretch: 112%;">配裝比較</div>
    <div style="font-size: 13px; color: #8d9bb0; margin-top: 3px;">換一個零件差在哪</div>
  </div>

  <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="border-radius: 12px; border: 1px solid #2f3d52; background: #121926; padding: 11px; display: flex; flex-direction: column; gap: 5px;">
      <span style="font-size: 11px; color: #6b7a90;">A</span>
      <span style="font-size: 14px; font-weight: 700;">蒼龍神劍</span>
      <span class="code" style="font-size: 14px; color: #ff5a41;">3-60F</span>
    </div>
    <div style="border-radius: 12px; border: 1px solid #2f3d52; background: #121926; padding: 11px; display: flex; flex-direction: column; gap: 5px;">
      <span style="font-size: 11px; color: #6b7a90;">B</span>
      <span style="font-size: 14px; font-weight: 700;">蒼龍神劍</span>
      <span class="code" style="font-size: 14px; color: #ff5a41;">3-80B</span>
    </div>
  </div>

  <div style="margin: 14px 16px 0; padding: 11px 13px; border-radius: 11px; border: 1px solid #1f4a38; background: #0d2019;">
    <div style="font-size: 13px; color: #58d39b; font-weight: 700;">只差一個零件</div>
    <div style="font-size: 12px; color: #9fb0c6; margin-top: 4px;">固鎖 <span class="code">3-60</span> → <span class="code">3-80</span>，軸心 <span class="code">F</span> → <span class="code">B</span></div>
  </div>

  <div style="margin: 14px 16px 0; border-radius: 14px; border: 1px solid #25303f; background: #121926; overflow: hidden;">

    <div class="axis" style="background: #161f2d; border-bottom: 1px solid #25303f;">
      <span style="font-size: 11px; color: #6b7a90;">六軸</span>
      <span style="font-size: 12px; font-weight: 700; text-align: center;">A</span>
      <span style="font-size: 12px; font-weight: 700; text-align: center;">B</span>
    </div>

    <div class="axis">
      <span class="axis-name">攻擊</span>
      <div style="background: #2e1512; border-radius: 7px; padding: 6px 0; text-align: center;"><span class="code" style="font-size: 15px; color: #ff8a72;">82</span></div>
      <div style="text-align: center;"><span class="code" style="font-size: 15px; color: #6b7a90;">44</span></div>
    </div>

    <div class="axis">
      <span class="axis-name">防守</span>
      <div style="text-align: center;"><span class="code" style="font-size: 15px; color: #6b7a90;">38</span></div>
      <div style="background: #14203a; border-radius: 7px; padding: 6px 0; text-align: center;"><span class="code" style="font-size: 15px; color: #6ea8ff;">61</span></div>
    </div>

    <div class="axis">
      <span class="axis-name">持久</span>
      <div style="text-align: center;"><span class="code" style="font-size: 15px; color: #6b7a90;">40</span></div>
      <div style="background: #0f2620; border-radius: 7px; padding: 6px 0; text-align: center;"><span class="code" style="font-size: 15px; color: #58d39b;">69</span></div>
    </div>

    <div class="axis">
      <span class="axis-name">爆發</span>
      <div style="background: #2e1512; border-radius: 7px; padding: 6px 0; text-align: center;"><span class="code" style="font-size: 15px; color: #ff8a72;">64</span></div>
      <div style="text-align: center;"><span class="code" style="font-size: 15px; color: #6b7a90;">35</span></div>
    </div>

    <div class="axis">
      <span class="axis-name">抗爆</span>
      <div style="text-align: center;"><span class="code" style="font-size: 15px; color: #6b7a90;">47</span></div>
      <div style="background: #1a2332; border-radius: 7px; padding: 6px 0; text-align: center;"><span class="code" style="font-size: 15px; color: #e7ecf3;">55</span></div>
    </div>

    <div class="axis" style="border-bottom: 0;">
      <span class="axis-name">操作難度</span>
      <div style="text-align: center;"><span class="code" style="font-size: 15px; color: #6b7a90;">61</span></div>
      <div style="background: #0f2620; border-radius: 7px; padding: 6px 0; text-align: center;"><span class="code" style="font-size: 15px; color: #58d39b;">32</span></div>
    </div>

  </div>

  <div style="margin: 12px 16px 0; padding: 13px 14px; border-radius: 14px; border: 1px solid #25303f; background: #121926;">
    <div style="font-size: 13px; font-weight: 700; color: #8d9bb0;">結論</div>
    <div style="font-size: 13px; color: #cdd7e4; margin-top: 7px; line-height: 1.55;">A 是先手壓制型，靠速度與爆發收快攻；B 換來的是站得住，適合被撞之後還要撐完整場。</div>
    <div style="font-size: 11px; color: #6b7a90; margin-top: 8px;">六軸為模型推估，不是官方數值</div>
  </div>

  <div style="flex: 1; min-height: 20px;"></div>

  <div style="display: flex; border-top: 1px solid #25303f; background: #0e141e; padding: 0 4px 8px;">
    <div class="nav">首頁</div>
    <div class="nav">商品</div>
    <div class="nav">零件</div>
    <div class="nav" style="color: #ff5a41; font-weight: 700; position: relative;">
      <div style="position: absolute; top: 0; left: 14px; right: 14px; height: 3px; border-radius: 0 0 3px 3px; background: #ff5a41;"></div>
      配裝
    </div>
    <div class="nav">3on3</div>
  </div>

</div>
</x-dc>
</body>
</html>
