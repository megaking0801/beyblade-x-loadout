<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif; }
    a { color: #ff6a4d; } a:hover { color: #ff8a72; }
    .code { font-stretch: 125%; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chip { font-size: 12px; font-weight: 600; border-radius: 8px; padding: 6px 11px; white-space: nowrap; }
    .tag { font-size: 11px; border-radius: 5px; padding: 1px 6px; }
    .nav { flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-bottom: 1px solid #1d2635; }
  </style>
</helmet>

<div style="width: 430px; min-height: 960px; background: #0b0f16; color: #e7ecf3; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 10px;">
    <div style="font-size: 26px; font-weight: 700; font-stretch: 112%;">我能組什麼</div>
    <div style="font-size: 13px; color: #8d9bb0; margin-top: 3px;">用現有零件排出來的配置，依六軸排序</div>
  </div>

  <div style="margin: 0 16px; display: flex; flex-wrap: wrap; gap: 6px;">
    <span class="chip" style="background: #ff5a41; color: #10151c;">只用我有的</span>
    <span class="chip" style="background: #131c2b; color: #9fb0c6; border: 1px solid #25303f;">全部圖鑑</span>
  </div>
  <div style="margin: 8px 16px 0; display: flex; flex-wrap: wrap; gap: 6px;">
    <span class="chip" style="background: #2e1512; color: #ff8a72; border: 1px solid #5c2820;">排序：攻擊</span>
    <span class="chip" style="background: #131c2b; color: #9fb0c6; border: 1px solid #25303f;">防守</span>
    <span class="chip" style="background: #131c2b; color: #9fb0c6; border: 1px solid #25303f;">持久</span>
    <span class="chip" style="background: #131c2b; color: #9fb0c6; border: 1px solid #25303f;">抗爆</span>
  </div>

  <div style="margin: 14px 16px 0; padding: 10px 13px; border-radius: 11px; border: 1px solid #25303f; background: #121926; display: flex; align-items: center; gap: 8px;">
    <span class="code" style="font-size: 18px; color: #ff5a41;">1188</span>
    <span style="font-size: 13px; color: #9fb0c6;">種可組配置</span>
    <span style="flex: 1;"></span>
    <span style="font-size: 11px; color: #6b7a90;">顯示前 30</span>
  </div>

  <div style="margin: 12px 16px 0; border-radius: 14px; border: 1px solid #25303f; background: #121926; overflow: hidden;">

    <div class="row">
      <div class="code" style="font-size: 13px; color: #55637a; width: 20px; flex: 0 0 20px;">1</div>
      <div style="width: 46px; height: 46px; border-radius: 9px; background: radial-gradient(circle at 40% 35%, #33415a 0%, #18202d 70%); flex: 0 0 46px; display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#7fa4d8" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#7fa4d8" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#7fa4d8" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-size: 14px; font-weight: 700;">蒼龍神劍</span>
          <span class="code" style="font-size: 14px; color: #ff5a41;">3-60F</span>
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <span style="height: 4px; width: 62px; border-radius: 2px; background: #1a2332; overflow: hidden; display: block;"><span style="display: block; width: 82%; height: 100%; background: #d83b2f;"></span></span>
          <span class="code" style="font-size: 11px; color: #ff8a72;">攻 82</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="tag" style="color: #58d39b; background: #0f2620; border: 1px solid #1f5140;">可組</div>
      </div>
    </div>

    <div class="row">
      <div class="code" style="font-size: 13px; color: #55637a; width: 20px; flex: 0 0 20px;">2</div>
      <div style="width: 46px; height: 46px; border-radius: 9px; background: radial-gradient(circle at 40% 35%, #33415a 0%, #18202d 70%); flex: 0 0 46px; display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#7fa4d8" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#7fa4d8" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#7fa4d8" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-size: 14px; font-weight: 700;">蒼龍神劍</span>
          <span class="code" style="font-size: 14px; color: #ff5a41;">3-60A</span>
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <span style="height: 4px; width: 62px; border-radius: 2px; background: #1a2332; overflow: hidden; display: block;"><span style="display: block; width: 78%; height: 100%; background: #d83b2f;"></span></span>
          <span class="code" style="font-size: 11px; color: #ff8a72;">攻 78</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="tag" style="color: #58d39b; background: #0f2620; border: 1px solid #1f5140;">可組</div>
      </div>
    </div>

    <div class="row">
      <div class="code" style="font-size: 13px; color: #55637a; width: 20px; flex: 0 0 20px;">3</div>
      <div style="width: 46px; height: 46px; border-radius: 9px; background: radial-gradient(circle at 40% 35%, #3a2a33 0%, #1f1820 70%); flex: 0 0 46px; display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#d88ea0" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#d88ea0" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#d88ea0" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-size: 14px; font-weight: 700;">惡魔紅鐮</span>
          <span class="code" style="font-size: 14px; color: #ff5a41;">4-60F</span>
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <span style="height: 4px; width: 62px; border-radius: 2px; background: #1a2332; overflow: hidden; display: block;"><span style="display: block; width: 71%; height: 100%; background: #d83b2f;"></span></span>
          <span class="code" style="font-size: 11px; color: #ff8a72;">攻 71</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="tag" style="color: #ffb454; background: #2a1e0c; border: 1px solid #55411c;">差 1 件</div>
      </div>
    </div>

    <div class="row" style="border-bottom: 0;">
      <div class="code" style="font-size: 13px; color: #55637a; width: 20px; flex: 0 0 20px;">4</div>
      <div style="width: 46px; height: 46px; border-radius: 9px; background: radial-gradient(circle at 40% 35%, #26383a 0%, #16222a 70%); flex: 0 0 46px; display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#6fc9b0" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#6fc9b0" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#6fc9b0" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-size: 14px; font-weight: 700;">魔導幻箭</span>
          <span class="code" style="font-size: 14px; color: #ff5a41;">4-80B</span>
        </div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <span style="height: 4px; width: 62px; border-radius: 2px; background: #1a2332; overflow: hidden; display: block;"><span style="display: block; width: 42%; height: 100%; background: #d83b2f;"></span></span>
          <span class="code" style="font-size: 11px; color: #9fb0c6;">攻 42</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="tag" style="color: #58d39b; background: #0f2620; border: 1px solid #1f5140;">可組</div>
      </div>
    </div>

  </div>

  <div style="margin: 12px 16px 0; font-size: 11px; color: #6b7a90;">分數為本站模型推估；「差 1 件」表示少一個零件就能組</div>

  <div style="flex: 1; min-height: 20px;"></div>

  <div style="display: flex; border-top: 1px solid #25303f; background: #0e141e; padding: 0 4px 8px;">
    <div class="nav">首頁</div>
    <div class="nav">商品</div>
    <div class="nav">零件</div>
    <div class="nav" style="color: #ff5a41; font-weight: 700; position: relative;">
      <div style="position: absolute; top: 0; left: 14px; right: 14px; height: 3px; border-radius: 0 0 3px 3px; background: #ff5a41;"></div>
      配裝
    </div>
    <div class="nav">3on3</div>
  </div>

</div>
</x-dc>
</body>
</html>
