<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif; }
    a { color: #ff6a4d; } a:hover { color: #ff8a72; }
    .code { font-stretch: 125%; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tag { font-size: 11px; border-radius: 5px; padding: 1px 6px; }
    .nav { flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600; }
  </style>
</helmet>

<div style="width: 430px; min-height: 900px; background: #0b0f16; color: #e7ecf3; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 10px;">
    <div style="font-size: 26px; font-weight: 700; font-stretch: 112%;">想買清單</div>
    <div style="font-size: 13px; color: #8d9bb0; margin-top: 3px;">哪一盒補得最多缺件</div>
  </div>

  <div style="margin: 0 16px; padding: 13px 14px; border-radius: 14px; border: 1px solid #3a2a12; background: #1a1409;">
    <div style="font-size: 13px; font-weight: 700; color: #ffb454;">最划算的一盒</div>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 11px;">
      <div style="width: 58px; height: 58px; border-radius: 11px; background: radial-gradient(circle at 40% 35%, #26383a 0%, #16222a 70%); flex: 0 0 58px; display: grid; place-items: center;">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#6fc9b0" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#6fc9b0" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#6fc9b0" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;">
          <span class="code" style="font-size: 11px; color: #7d8ca3;">UX-03</span>
          <span style="font-size: 15px; font-weight: 700;">魔導神杖</span>
          <span class="code" style="font-size: 14px; color: #ff5a41;">5-70DB</span>
        </div>
        <span style="font-size: 12px; color: #9fb0c6;">補齊 <span class="code" style="color: #ffb454;">3</span> 件缺件，解鎖 <span class="code" style="color: #ffb454;">42</span> 種新配置</span>
      </div>
    </div>
  </div>

  <div style="padding: 18px 16px 8px; font-size: 13px; font-weight: 700; color: #8d9bb0;">我加的清單</div>

  <div style="margin: 0 16px; border-radius: 14px; border: 1px solid #25303f; background: #121926; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-bottom: 1px solid #1d2635;">
      <div style="width: 46px; height: 46px; border-radius: 9px; background: radial-gradient(circle at 40% 35%, #263049 0%, #161d2b 70%); flex: 0 0 46px; display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#8fa8e8" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#8fa8e8" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#8fa8e8" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;">
          <span class="code" style="font-size: 11px; color: #7d8ca3;">CX-14</span>
          <span style="font-size: 14px; font-weight: 700;">騎士堡壘</span>
          <span class="code" style="font-size: 13px; color: #ff5a41;">GV8-70UN</span>
        </div>
        <span style="font-size: 11px; color: #6b7a90;">補 2 件・解鎖 18 種</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <div style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid #2a3446; background: #1a2332; display: grid; place-items: center; font-size: 15px; color: #9fb0c6;">−</div>
        <span class="code" style="font-size: 15px; min-width: 14px; text-align: center;">1</span>
        <div style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid #2a3446; background: #1a2332; display: grid; place-items: center; font-size: 15px; color: #9fb0c6;">＋</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; padding: 11px 13px;">
      <div style="width: 46px; height: 46px; border-radius: 9px; background: radial-gradient(circle at 40% 35%, #3a2a33 0%, #1f1820 70%); flex: 0 0 46px; display: grid; place-items: center;">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#d88ea0" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#d88ea0" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#d88ea0" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;">
          <span class="code" style="font-size: 11px; color: #7d8ca3;">BX-48</span>
          <span style="font-size: 14px; font-weight: 700;">隨機強化組</span>
          <span class="code" style="font-size: 13px; color: #9fb0c6;">Vol.9</span>
        </div>
        <span style="font-size: 11px; color: #ffb454;">隨機內容，開封後自行登記</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <div style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid #2a3446; background: #1a2332; display: grid; place-items: center; font-size: 15px; color: #9fb0c6;">−</div>
        <span class="code" style="font-size: 15px; min-width: 14px; text-align: center;">2</span>
        <div style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid #2a3446; background: #1a2332; display: grid; place-items: center; font-size: 15px; color: #9fb0c6;">＋</div>
      </div>
    </div>

  </div>

  <div style="margin: 14px 16px 0; padding: 12px 14px; border-radius: 12px; border: 1px solid #25303f; background: #121926; display: flex; align-items: center; gap: 10px;">
    <span style="font-size: 13px; color: #9fb0c6; flex: 1;">清單合計</span>
    <span class="code" style="font-size: 18px;">3</span>
    <span style="font-size: 12px; color: #6b7a90;">盒</span>
  </div>

  <div style="flex: 1; min-height: 20px;"></div>

  <div style="display: flex; border-top: 1px solid #25303f; background: #0e141e; padding: 0 4px 8px;">
    <div class="nav">首頁</div>
    <div class="nav" style="color: #ff5a41; font-weight: 700; position: relative;">
      <div style="position: absolute; top: 0; left: 14px; right: 14px; height: 3px; border-radius: 0 0 3px 3px; background: #ff5a41;"></div>
      商品
    </div>
    <div class="nav">零件</div>
    <div class="nav">配裝</div>
    <div class="nav">3on3</div>
  </div>

</div>
</x-dc>
</body>
</html>
