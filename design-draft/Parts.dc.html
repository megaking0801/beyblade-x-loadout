<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif; }
    a { color: #ff6a4d; } a:hover { color: #ff8a72; }
    .code { font-stretch: 125%; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chip { font-size: 12px; font-weight: 600; border-radius: 8px; padding: 6px 11px; white-space: nowrap; }
    .tag { font-size: 11px; border-radius: 5px; padding: 1px 6px; }
  </style>
</helmet>

<div style="width: 430px; min-height: 932px; background: #0b0f16; color: #e7ecf3; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 10px;">
    <div style="font-size: 26px; font-weight: 700; font-stretch: 112%;">零件庫</div>
    <div style="font-size: 13px; color: #8d9bb0; margin-top: 3px;">可用數量才會進配裝器與 3on3</div>
  </div>

  <div style="margin: 0 16px; display: flex; align-items: center; gap: 8px; background: #121926; border: 1px solid #25303f; border-radius: 10px; padding: 0 12px; min-height: 44px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8d9bb0" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="font-size: 14px; color: #6b7a90;">搜尋名稱或型號</span>
  </div>

  <div style="margin: 12px 16px 0; display: flex; flex-wrap: wrap; gap: 6px;">
    <span class="chip" style="background: #ff5a41; color: #10151c;">全部</span>
    <span class="chip" style="background: #131c2b; color: #9fb0c6; border: 1px solid #25303f;">BX</span>
    <span class="chip" style="background: #131c2b; color: #9fb0c6; border: 1px solid #25303f;">UX</span>
    <span class="chip" style="background: #131c2b; color: #9fb0c6; border: 1px solid #25303f;">CX</span>
  </div>
  <div style="margin: 8px 16px 0; display: flex; flex-wrap: wrap; gap: 6px;">
    <span class="chip" style="background: #2e1512; color: #ff8a72; border: 1px solid #5c2820;">攻擊</span>
    <span class="chip" style="background: #14203a; color: #6ea8ff; border: 1px solid #23406e;">防守</span>
    <span class="chip" style="background: #0f2620; color: #58d39b; border: 1px solid #1f5140;">持久</span>
    <span class="chip" style="background: #2a1e0c; color: #ffb454; border: 1px solid #55411c;">均衡</span>
  </div>

  <div style="padding: 18px 16px 8px; display: flex; align-items: baseline; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; color: #8d9bb0;">上蓋</span>
    <span class="code" style="font-size: 13px; color: #55637a;">12</span>
  </div>

  <div style="margin: 0 16px; border-radius: 14px; border: 1px solid #25303f; background: #121926; overflow: hidden; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-bottom: 1px solid #1d2635;">
      <div style="width: 54px; height: 54px; border-radius: 10px; background: radial-gradient(circle at 40% 35%, #33415a 0%, #18202d 70%); flex: 0 0 54px; display: grid; place-items: center;">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#7fa4d8" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#7fa4d8" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#7fa4d8" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 15px; font-weight: 700;">蒼龍神劍</div>
        <div style="display: flex; gap: 5px; align-items: center;">
          <span class="tag" style="color: #ff8a72; background: #2e1512; border: 1px solid #5c2820;">攻擊</span>
          <span class="code" style="font-size: 11px; color: #9fb0c6;">34.8g</span>
          <span class="code" style="font-size: 11px; color: #6b7a90;">右旋</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="code" style="font-size: 18px;">×3</div>
        <div style="font-size: 11px; color: #6b7a90;">可用</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-bottom: 1px solid #1d2635;">
      <div style="width: 54px; height: 54px; border-radius: 10px; background: radial-gradient(circle at 40% 35%, #3a2a33 0%, #1f1820 70%); flex: 0 0 54px; display: grid; place-items: center;">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#d88ea0" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#d88ea0" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#d88ea0" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 15px; font-weight: 700;">惡魔紅鐮</div>
        <div style="display: flex; gap: 5px; align-items: center;">
          <span class="tag" style="color: #ffb454; background: #2a1e0c; border: 1px solid #55411c;">均衡</span>
          <span class="code" style="font-size: 11px; color: #9fb0c6;">32.7g</span>
          <span class="code" style="font-size: 11px; color: #6b7a90;">右旋</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="code" style="font-size: 18px;">×1</div>
        <div style="font-size: 11px; color: #6b7a90;">可用</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-bottom: 1px solid #1d2635;">
      <div style="width: 54px; height: 54px; border-radius: 10px; background: radial-gradient(circle at 40% 35%, #26383a 0%, #16222a 70%); flex: 0 0 54px; display: grid; place-items: center;">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#6fc9b0" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#6fc9b0" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#6fc9b0" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 15px; font-weight: 700;">魔導幻箭</div>
        <div style="display: flex; gap: 5px; align-items: center;">
          <span class="tag" style="color: #58d39b; background: #0f2620; border: 1px solid #1f5140;">持久</span>
          <span class="code" style="font-size: 11px; color: #9fb0c6;">32g</span>
          <span class="code" style="font-size: 11px; color: #6b7a90;">右旋</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="code" style="font-size: 18px;">×2</div>
        <div style="font-size: 11px; color: #6b7a90;">可用</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 11px 13px;">
      <div style="width: 54px; height: 54px; border-radius: 10px; background: radial-gradient(circle at 40% 35%, #263049 0%, #161d2b 70%); flex: 0 0 54px; display: grid; place-items: center;">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#8fa8e8" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#8fa8e8" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#8fa8e8" stroke-width="2.5" stroke-linecap="round"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 15px; font-weight: 700;">騎士重盾</div>
        <div style="display: flex; gap: 5px; align-items: center;">
          <span class="tag" style="color: #6ea8ff; background: #14203a; border: 1px solid #23406e;">防守</span>
          <span class="code" style="font-size: 11px; color: #9fb0c6;">32.3g</span>
          <span class="code" style="font-size: 11px; color: #6b7a90;">右旋</span>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="code" style="font-size: 18px;">×1</div>
        <div style="font-size: 11px; color: #6b7a90;">可用</div>
      </div>
    </div>

  </div>

  <div style="padding: 18px 16px 8px; display: flex; align-items: baseline; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; color: #8d9bb0;">固鎖</span>
    <span class="code" style="font-size: 13px; color: #55637a;">9</span>
  </div>
  <div style="margin: 0 16px; display: flex; flex-wrap: wrap; gap: 8px;">
    <div style="border: 1px solid #25303f; background: #121926; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 8px;">
      <span class="code" style="font-size: 15px;">3-60</span>
      <span class="code" style="font-size: 12px; color: #8d9bb0;">×3</span>
    </div>
    <div style="border: 1px solid #25303f; background: #121926; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 8px;">
      <span class="code" style="font-size: 15px;">4-60</span>
      <span class="code" style="font-size: 12px; color: #8d9bb0;">×2</span>
    </div>
    <div style="border: 1px solid #25303f; background: #121926; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 8px;">
      <span class="code" style="font-size: 15px;">9-60</span>
      <span class="code" style="font-size: 12px; color: #8d9bb0;">×1</span>
    </div>
    <div style="border: 1px solid #5c2820; background: #2e1512; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 8px;">
      <span class="code" style="font-size: 15px; color: #ff8a72;">1-60</span>
      <span style="font-size: 11px; color: #ff8a72;">高手 X　3/5</span>
    </div>
  </div>

  <div style="flex: 1; min-height: 24px;"></div>

  <div style="display: flex; border-top: 1px solid #25303f; background: #0e141e; padding: 0 4px 8px;">
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">首頁</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">商品</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #ff5a41; font-size: 14px; font-weight: 700; position: relative;">
      <div style="position: absolute; top: 0; left: 14px; right: 14px; height: 3px; border-radius: 0 0 3px 3px; background: #ff5a41;"></div>
      零件
    </div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">配裝</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">3on3</div>
  </div>

</div>
</x-dc>
</body>
</html>
