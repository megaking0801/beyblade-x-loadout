<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif; }
    a { color: #ff6a4d; } a:hover { color: #ff8a72; }
    .code { font-stretch: 125%; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tag { font-size: 11px; border-radius: 5px; padding: 1px 6px; }
  </style>
</helmet>

<div style="width: 430px; min-height: 980px; background: #0b0f16; color: #e7ecf3; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 10px;">
    <div style="font-size: 26px; font-weight: 700; font-stretch: 112%;">3on3 組隊</div>
    <div style="font-size: 13px; color: #8d9bb0; margin-top: 3px;">三顆不可重複使用相同零件</div>
  </div>

  <div style="margin: 0 16px; padding: 11px 13px; border-radius: 11px; border: 1px solid #1f4a38; background: #0d2019; display: flex; align-items: center; gap: 9px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#58d39b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
    <span style="font-size: 13px; color: #58d39b; flex: 1;">三顆都可實際組裝，庫存足夠</span>
  </div>

  <div style="margin: 14px 16px 0; display: flex; flex-direction: column; gap: 10px;">

    <div style="border-radius: 14px; border: 1px solid #2e1a16; background: #121926; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: #1c1210; border-bottom: 1px solid #2e1a16;">
        <span class="code" style="font-size: 12px; color: #ff8a72;">1</span>
        <span style="font-size: 13px; font-weight: 700; color: #ff8a72;">先鋒・攻擊</span>
        <span style="flex: 1;"></span>
        <span style="font-size: 11px; color: #8d9bb0;">主動找對手</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 13px;">
        <div style="width: 52px; height: 52px; border-radius: 10px; background: radial-gradient(circle at 40% 35%, #33415a 0%, #18202d 70%); flex: 0 0 52px; display: grid; place-items: center;">
          <svg width="32" height="32" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#7fa4d8" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#7fa4d8" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#7fa4d8" stroke-width="2.5" stroke-linecap="round"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <span style="font-size: 15px; font-weight: 700;">蒼龍神劍</span>
            <span class="code" style="font-size: 15px; color: #ff5a41;">3-60F</span>
          </div>
          <div style="display: flex; gap: 5px;">
            <span class="tag" style="color: #ff8a72; background: #2e1512; border: 1px solid #5c2820;">攻擊</span>
            <span class="code" style="font-size: 11px; color: #9fb0c6;">34.8g</span>
          </div>
        </div>
      </div>
    </div>

    <div style="border-radius: 14px; border: 1px solid #16283f; background: #121926; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: #101a28; border-bottom: 1px solid #16283f;">
        <span class="code" style="font-size: 12px; color: #6ea8ff;">2</span>
        <span style="font-size: 13px; font-weight: 700; color: #6ea8ff;">中堅・防守</span>
        <span style="flex: 1;"></span>
        <span style="font-size: 11px; color: #8d9bb0;">承受撞擊</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 13px;">
        <div style="width: 52px; height: 52px; border-radius: 10px; background: radial-gradient(circle at 40% 35%, #263049 0%, #161d2b 70%); flex: 0 0 52px; display: grid; place-items: center;">
          <svg width="32" height="32" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#8fa8e8" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#8fa8e8" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#8fa8e8" stroke-width="2.5" stroke-linecap="round"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <span style="font-size: 15px; font-weight: 700;">騎士重盾</span>
            <span class="code" style="font-size: 15px; color: #ff5a41;">3-80N</span>
          </div>
          <div style="display: flex; gap: 5px;">
            <span class="tag" style="color: #6ea8ff; background: #14203a; border: 1px solid #23406e;">防守</span>
            <span class="code" style="font-size: 11px; color: #9fb0c6;">32.3g</span>
          </div>
        </div>
      </div>
    </div>

    <div style="border-radius: 14px; border: 1px solid #14302a; background: #121926; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 9px 13px; background: #0d1d1a; border-bottom: 1px solid #14302a;">
        <span class="code" style="font-size: 12px; color: #58d39b;">3</span>
        <span style="font-size: 13px; font-weight: 700; color: #58d39b;">大將・持久</span>
        <span style="flex: 1;"></span>
        <span style="font-size: 11px; color: #8d9bb0;">拖到最後</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 13px;">
        <div style="width: 52px; height: 52px; border-radius: 10px; background: radial-gradient(circle at 40% 35%, #26383a 0%, #16222a 70%); flex: 0 0 52px; display: grid; place-items: center;">
          <svg width="32" height="32" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="19" stroke="#6fc9b0" stroke-width="2.5"></circle><circle cx="24" cy="24" r="8" stroke="#6fc9b0" stroke-width="2"></circle><path d="M24 5v8M43 24h-8M24 43v-8M5 24h8" stroke="#6fc9b0" stroke-width="2.5" stroke-linecap="round"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <span style="font-size: 15px; font-weight: 700;">魔導幻箭</span>
            <span class="code" style="font-size: 15px; color: #ff5a41;">4-80B</span>
          </div>
          <div style="display: flex; gap: 5px;">
            <span class="tag" style="color: #58d39b; background: #0f2620; border: 1px solid #1f5140;">持久</span>
            <span class="code" style="font-size: 11px; color: #9fb0c6;">32g</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div style="margin: 16px 16px 0; padding: 13px 14px; border-radius: 14px; border: 1px solid #25303f; background: #121926;">
    <div style="font-size: 13px; font-weight: 700; color: #8d9bb0;">隊伍覆蓋</div>
    <div style="display: flex; gap: 7px; margin-top: 10px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span class="code" style="font-size: 20px; color: #ff8a72;">1</span>
        <span style="font-size: 11px; color: #8d9bb0;">攻擊</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span class="code" style="font-size: 20px; color: #6ea8ff;">1</span>
        <span style="font-size: 11px; color: #8d9bb0;">防守</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span class="code" style="font-size: 20px; color: #58d39b;">1</span>
        <span style="font-size: 11px; color: #8d9bb0;">持久</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span class="code" style="font-size: 20px; color: #55637a;">0</span>
        <span style="font-size: 11px; color: #8d9bb0;">均衡</span>
      </div>
    </div>
  </div>

  <div style="flex: 1; min-height: 16px;"></div>

  <div style="margin: 0 16px 14px;">
    <div style="min-height: 48px; border-radius: 10px; background: #ff5a41; color: #10151c; display: grid; place-items: center; font-size: 15px; font-weight: 700;">儲存這副隊伍</div>
  </div>

  <div style="display: flex; border-top: 1px solid #25303f; background: #0e141e; padding: 0 4px 8px;">
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">首頁</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">商品</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">零件</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #8d9bb0; font-size: 14px; font-weight: 600;">配裝</div>
    <div style="flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; color: #ff5a41; font-size: 14px; font-weight: 700; position: relative;">
      <div style="position: absolute; top: 0; left: 14px; right: 14px; height: 3px; border-radius: 0 0 3px 3px; background: #ff5a41;"></div>
      3on3
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
